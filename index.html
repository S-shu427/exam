    align-items: center;

  }

  .option-item.wrong {

<div class="container" id="app">

            <option value="20">20</option>
            <option value="30">30</option>
            <option value="50">50</option>
            <option value="80">80</option>
            <option value="100">100</option>
            <option value="150">150</option>

        </div>
        <div class="setting-control">

        </div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="startExam()">🚀 开始考试</button>
    <button class="btn btn-secondary" onclick="showWrongBook()" id="btn-wrong-book">📖 错题本 (8)</button>
    <button class="btn btn-secondary" onclick="promptExamRecords()" id="btn-records" style="margin-top:8px">🔐 管理面板</button>
  </div>

  <!-- 考试页 -->
  <div id="page-exam" class="hide">
    <div class="exam-header" style="flex-wrap:wrap;gap:4px">
      <span style="font-size:16px;font-weight:600;color:#4f6ef7" id="student-badge"></span>
      <span style="flex:1"></span>
      <span id="q-progress">第 1/10 题</span>

    </div>
    <div class="progress-bar">
      <div class="fill" id="progress-fill" style="width:0%"></div>
    </div>
    <div class="card">

      <div class="nav-buttons">

        <button class="btn btn-secondary hide" id="btn-next" onclick="nextQuestion()">下一题 →</button>
      </div>
    </div>
  </div>

  <!-- 结果页 -->
  <div id="page-result" class="hide">
    <div class="card">
      <div class="result-icon" id="result-icon">🎉</div>
      <div class="result-score">
        <div class="big" id="result-score">0</div>
        <div class="label">分</div>
      </div>
      <div style="text-align:center;font-size:14px;color:#666;margin-top:-10px;margin-bottom:10px" id="result-student-info"></div>

      </div>
      <div class="result-detail" id="result-detail"></div>

    <div class="header"><h1>📖 错题本</h1></div>
    <div class="card" id="wrong-list"></div>
    <button class="btn btn-secondary" onclick="showHome()">🏠 返回首页</button>

</div>

// 页面加载时更新错题按钮
updateWrongBtn();

// ============================================================
// 状态管理
// ============================================================
let state = {
  questions: [],        // 本次考试的题目子集
  currentQ: 0,          // 当前题目索引
  answers: {},          // { qIndex: selectedIndex(es) }
  confirmed: {},        // { qIndex: true }
  correctCount: 0,
  wrongCount: 0,
  emptyCount: 0,
  studentName: '',
  studentId: '',
  timerId: null,
  timePerQ: 0,
  timeLeft: 0,
  isSubmitted: false,
  wrongMode: false
};

// 错题存储 (localStorage)
function getWrongIds() {
  try { return JSON.parse(localStorage.getItem('exam_wrong_ids') || '[]'); }
  catch { return []; }
}
function saveWrongIds(ids) {
  localStorage.setItem('exam_wrong_ids', JSON.stringify([...new Set(ids)]));
}
function addWrongIds(ids) {
  const cur = getWrongIds();
  ids.forEach(i => { if(!cur.includes(i)) cur.push(i); });
  saveWrongIds(cur);
}
function removeWrongIds(ids) {
  const cur = getWrongIds().filter(i => !ids.includes(i));
  saveWrongIds(cur);
}

function toggleWrongMode() {
  const cb = document.getElementById('wrong-mode');
  if (cb.checked && getWrongIds().length === 0) {
    cb.checked = false;
    alert('🎉 错题本是空的，没有错题哦！');
  }
}

// ============================================================
// 页面导航
// ============================================================
function showHome() {
  document.getElementById('page-home').classList.remove('hide');
  document.getElementById('page-exam').classList.add('hide');
  document.getElementById('page-result').classList.add('hide');
  document.getElementById('page-wrongbook').classList.add('hide');
  document.getElementById('page-records').classList.add('hide');
  clearTimer();
  updateWrongBtn();
}

function updateWrongBtn() {
  const count = getWrongIds().length;
  document.getElementById('btn-wrong-book').textContent = count > 0
    ? `📖 错题本 (${count})`
    : '📖 错题本';
}

// ============================================================
// 开始考试
// ============================================================
function startExam() {
  const count = parseInt(document.getElementById('exam-count').value);
  const wrongMode = document.getElementById('wrong-mode').checked;
  const timePerQ = parseInt(document.getElementById('exam-time-per-q').value);

  let pool;
  if (wrongMode) {
    const wrongIds = getWrongIds();
    pool = QUESTION_BANK.filter(q => wrongIds.includes(q.id));
    if (pool.length === 0) { alert('🎉 没有错题！'); return; }
  } else {
    pool = [...QUESTION_BANK];
  }

  // 随机抽取
  const shuffled = pool.sort(() => Math.random() - 0.5);
  const selected = shuffled.slice(0, Math.min(count, shuffled.length));

  state.questions = selected;
  state.currentQ = 0;
  state.answers = {};
  state.confirmed = {};
  state.correctCount = 0;
  state.wrongCount = 0;
  state.emptyCount = 0;
  state.timePerQ = timePerQ;
  state.isSubmitted = false;
  state.wrongMode = wrongMode;

  document.getElementById('page-home').classList.add('hide');
  document.getElementById('page-exam').classList.remove('hide');
  document.getElementById('page-result').classList.add('hide');

  renderQuestion(0);
}

// ============================================================
// 渲染题目
// ============================================================
function renderQuestion(index) {
  const q = state.questions[index];
  if (!q) return;

  const total = state.questions.length;
  document.getElementById('q-number').textContent = `第 ${index + 1} 题`;
  document.getElementById('q-progress').textContent = `第 ${index + 1}/${total} 题`;
  document.getElementById('progress-fill').style.width = `${(index / total) * 100}%`;

  const tag = q.type === 'single'
    ? '<span class="q-tag single">单选题</span>'
    : '<span class="q-tag multi">多选题</span>';
  document.getElementById('q-text').innerHTML = tag + q.q;

  const optsContainer = document.getElementById('q-options');
  optsContainer.innerHTML = '';
  q.options.forEach((opt, oi) => {
    const li = document.createElement('li');
    li.className = 'option-item' + (q.type === 'multi' ? ' multi' : '');
    li.dataset.index = oi;

    const cb = document.createElement('div');
    cb.className = 'checkbox';
    cb.textContent = q.type === 'multi' ? '□' : '○';

    const span = document.createElement('span');
    span.textContent = opt;

    li.appendChild(cb);
    li.appendChild(span);

    // 如果已经确认过，显示结果
    if (state.confirmed[index]) {
      li.style.cursor = 'default';
      li.onclick = null;
      const userAns = state.answers[index] || [];
      const userArr = Array.isArray(userAns) ? userAns : [userAns];
      const correctArr = Array.isArray(q.answer) ? q.answer : [q.answer];
      if (userArr.includes(oi)) {
        li.classList.add(correctArr.includes(oi) ? 'correct' : 'wrong');
        cb.textContent = correctArr.includes(oi) ? '✓' : '✗';
      } else if (correctArr.includes(oi) && q.type === 'multi') {
        li.classList.add('missed');
        cb.textContent = '○';
      }
    } else {
      // 选择模式
      li.onclick = () => selectOption(index, oi, q.type);
      const userAns = state.answers[index];
      if (userAns !== undefined) {
        const arr = Array.isArray(userAns) ? userAns : [userAns];
        if (arr.includes(oi)) {
          li.classList.add('selected');
          cb.textContent = q.type === 'multi' ? '■' : '●';
        }
      }
    }

    optsContainer.appendChild(li);
  });

  // 按钮状态
  const btnConfirm = document.getElementById('btn-confirm');
  const btnNext = document.getElementById('btn-next');
  if (state.confirmed[index]) {
    btnConfirm.classList.add('hide');
    btnNext.classList.remove('hide');
    btnNext.textContent = index < total - 1 ? '下一题 →' : (state.wrongMode ? '🏁 完成' : '📊 交卷');
    btnConfirm.disabled = true;
  } else {
    btnConfirm.classList.remove('hide');
    btnNext.classList.add('hide');
    btnConfirm.disabled = state.answers[index] === undefined ||
      (q.type === 'multi' && Array.isArray(state.answers[index]) && state.answers[index].length === 0);
  }

  // 反馈区
  const feedback = document.getElementById('q-feedback');
  feedback.classList.add('hide');
  feedback.innerHTML = '';

  // 计时器
  clearTimer();
  if (state.timePerQ > 0 && !state.confirmed[index]) {
    state.timeLeft = state.timePerQ;
    updateTimerDisplay();
    state.timerId = setInterval(() => {
      state.timeLeft--;
      updateTimerDisplay();
      if (state.timeLeft <= 0) {
        clearTimer();
        autoAdvance(index);
      }
    }, 1000);
  } else {
    document.getElementById('timer').textContent = '--:--';
  }
}

function selectOption(qIdx, optIdx, type) {
  if (state.confirmed[qIdx]) return;

  const key = qIdx;
  if (type === 'single') {
    state.answers[key] = optIdx;
  } else {
    const current = state.answers[key];
    const arr = Array.isArray(current) ? [...current] : [];
    const pos = arr.indexOf(optIdx);
    if (pos >= 0) arr.splice(pos, 1);
    else arr.push(optIdx);
    arr.sort((a, b) => a - b);
    state.answers[key] = arr;
  }
  renderQuestion(qIdx);
}

// ============================================================
// 确认 & 跳题
// ============================================================
function confirmAnswer() {
  const idx = state.currentQ;
  if (state.confirmed[idx]) return;

  const q = state.questions[idx];
  const userAns = state.answers[idx];

  if (userAns === undefined || (Array.isArray(userAns) && userAns.length === 0)) {
    return;
  }

  state.confirmed[idx] = true;
  clearTimer();

  // 判分
  const correctArr = Array.isArray(q.answer) ? q.answer : [q.answer];
  const userArr = Array.isArray(userAns) ? userAns : [userAns];
  const isCorrect =
    correctArr.length === userArr.length &&
    correctArr.every(v => userArr.includes(v));

  if (isCorrect) state.correctCount++;
  else state.wrongCount++;

  // 显示反馈
  const feedback = document.getElementById('q-feedback');
  feedback.classList.remove('hide');
  if (isCorrect) {
    feedback.style.background = '#f0fdf4';
    feedback.style.color = '#16a34a';
    feedback.innerHTML = '✅ <strong>回答正确！</strong>';
    if (q.explain) feedback.innerHTML += '<br>' + q.explain;
  } else {
    feedback.style.background = '#fef2f2';
    feedback.style.color = '#dc2626';
    const correctText = correctArr.map(i => q.options[i]).join('、');
    feedback.innerHTML = `❌ <strong>回答错误</strong><br>正确答案：<strong>${correctText}</strong>`;
    if (q.explain) feedback.innerHTML += '<br>' + q.explain;
  }

  // 不正确的题记录错题
  const allWrongIds = state.questions
    .filter((_, i) => {
      if (!state.confirmed[i]) return false;
      const cArr = Array.isArray(state.questions[i].answer) ? state.questions[i].answer : [state.questions[i].answer];
      const uArr = Array.isArray(state.answers[i]) ? state.answers[i] : [state.answers[i]];
      return !(cArr.length === uArr.length && cArr.every(v => uArr.includes(v)));
    })
    .map(q => q.id);
  addWrongIds(allWrongIds);

  renderQuestion(idx);
}

function autoAdvance(idx) {
  const q = state.questions[idx];
  if (state.confirmed[idx]) return;

  state.confirmed[idx] = true;
  state.emptyCount++;
  state.wrongCount++;

  const feedback = document.getElementById('q-feedback');
  feedback.classList.remove('hide');
  feedback.style.background = '#fffbeb';
  feedback.style.color = '#d97706';
  const correctArr = Array.isArray(q.answer) ? q.answer : [q.answer];
  const correctText = correctArr.map(i => q.options[i]).join('、');
  feedback.innerHTML = `⏰ <strong>超时未答</strong><br>正确答案：<strong>${correctText}</strong>`;
  if (q.explain) feedback.innerHTML += '<br>' + q.explain;

  // 记录错题
  addWrongIds([q.id]);

  renderQuestion(idx);
}

function nextQuestion() {
  const next = state.currentQ + 1;
  if (next >= state.questions.length) {
    showResult();
    return;
  }
  state.currentQ = next;
  renderQuestion(next);
}

// ============================================================
// 计时器
// ============================================================
function clearTimer() {
  if (state.timerId) {
    clearInterval(state.timerId);
    state.timerId = null;
  }
}
function updateTimerDisplay() {
  const el = document.getElementById('timer');
  if (state.timePerQ <= 0) { el.textContent = '--:--'; return; }
  const m = Math.floor(state.timeLeft / 60);
  const s = state.timeLeft % 60;
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  el.className = 'timer';
  if (state.timeLeft <= 10) el.classList.add('danger');
  else if (state.timeLeft <= 20) el.classList.add('warning');
}

// ============================================================
// 结果页
// ============================================================
function showResult() {
  saveExamRecord();
  clearTimer();
  document.getElementById('page-exam').classList.add('hide');
  document.getElementById('page-result').classList.remove('hide');

  const total = state.questions.length;
  const correct = state.correctCount;
  const wrong = state.wrongCount;
  const empty = state.emptyCount || 0;
  const score = total > 0 ? Math.round((correct / total) * 100) : 0;

  document.getElementById('result-score').textContent = score;
  document.getElementById('result-student-info').textContent = state.studentName + ' - ' + state.studentId;
  document.getElementById('r-correct').textContent = correct;
  document.getElementById('r-wrong').textContent = wrong;
  document.getElementById('r-empty').textContent = empty;

  if (score >= 90) document.getElementById('result-icon').textContent = '🏆';
  else if (score >= 70) document.getElementById('result-icon').textContent = '🎉';
  else if (score >= 60) document.getElementById('result-icon').textContent = '👍';
  else document.getElementById('result-icon').textContent = '💪';

  // 详情
  const detail = document.getElementById('result-detail');
  detail.innerHTML = '<h3 style="margin-bottom:12px">📋 题目详情</h3>';
  state.questions.forEach((q, i) => {
    const userAns = state.answers[i];
    const correctArr = Array.isArray(q.answer) ? q.answer : [q.answer];
    const userArr = userAns !== undefined ? (Array.isArray(userAns) ? userAns : [userAns]) : [];
    const isCorrect = state.confirmed[i] && correctArr.length === userArr.length && correctArr.every(v => userArr.includes(v));

    const div = document.createElement('div');
    div.className = 'q-review';
    const tag = q.type === 'single' ? '单选题' : '多选题';
    const userText = userArr.length > 0 ? userArr.map(j => q.options[j]).join('、') : '（未作答）';
    const correctText = correctArr.map(j => q.options[j]).join('、');
    div.innerHTML = `
      <div class="review-q">${isCorrect ? '✅' : '❌'} ${tag}：${q.q}</div>
      <div class="review-answer">
        <span class="label">你的答案：</span>
        <span class="val ${isCorrect ? 'correct-text' : 'wrong-text'}">${userText}</span><br>
        <span class="label">正确答案：</span>
        <span class="val correct-text">${correctText}</span>
      </div>
    `;
    detail.appendChild(div);
  });
}

// ============================================================
// 错题本
// ============================================================
function showWrongBook() {
  const wrongIds = getWrongIds();
  document.getElementById('page-home').classList.add('hide');
  document.getElementById('page-wrongbook').classList.remove('hide');

  const container = document.getElementById('wrong-list');
  container.innerHTML = '';

  if (wrongIds.length === 0) {
    container.innerHTML = '<div class="wi-empty">🎉 没有错题，继续保持！</div>';
    return;
  }

  const wrongQuestions = QUESTION_BANK.filter(q => wrongIds.includes(q.id));
  wrongQuestions.forEach(q => {
    const div = document.createElement('div');
    div.className = 'wrong-item';
    const tag = q.type === 'single' ? '单选题' : '多选题';
    const correctText = (Array.isArray(q.answer) ? q.answer : [q.answer]).map(j => q.options[j]).join('、');
    div.innerHTML = `
      <div class="wi-q">${tag}：${q.q}</div>
      <div class="wi-info"><span class="wi-label">正确答案：</span>${correctText}</div>
      ${q.explain ? `<div class="wi-info" style="margin-top:4px"><span class="wi-label">解析：</span>${q.explain}</div>` : ''}
      <button class="btn btn-secondary" style="margin-top:10px;padding:8px;font-size:13px;width:auto;display:inline-block"
        onclick="removeWrongIds([${q.id}]); showWrongBook();">删除此题</button>
    `;
    container.appendChild(div);
  });

  container.innerHTML += `
    <button class="btn btn-danger" style="margin-top:10px" onclick="
      if(confirm('确定清空所有错题？')) { saveWrongIds([]); showWrongBook(); updateWrongBtn(); }
    ">🗑️ 清空错题本</button>
  `;
  updateWrongBtn();
}

function saveExamRecord() {
  try {
    const records = JSON.parse(localStorage.getItem('exam_records') || '[]');
    records.push({
      name: state.studentName,
      id: state.studentId,
      score: Math.round(state.correctCount / state.questions.length * 100),
      correct: state.correctCount,
      wrong: state.wrongCount,
      empty: state.emptyCount,
      total: state.questions.length,
      time: new Date().toLocaleString('zh-CN')
    });
    localStorage.setItem('exam_records', JSON.stringify(records.slice(-50)));
  } catch(e) {}
}

function promptExamRecords() {
  const pwd = prompt('请输入管理密码查看考试记录：');
  if (pwd === null) return;
  if (pwd !== 'xiaosu888') {
    alert('密码错误！');
    return;
  }
  showExamRecords();
}

function showExamRecords() {
  document.getElementById('page-home').classList.add('hide');
  document.getElementById('page-records').classList.remove('hide');
  const container = document.getElementById('records-list');
  container.innerHTML = '<div style="text-align:center;color:#999;padding:20px 0">加载中...</div>';
  try {
    const records = JSON.parse(localStorage.getItem('exam_records') || '[]');
    if (records.length === 0) {
      container.innerHTML = '<div style="text-align:center;color:#999;padding:40px 0;font-size:15px">📭 暂无考试记录</div>';
      return;
    }
    // Summary stats
    const total = records.length;
    const avgScore = Math.round(records.reduce((s, r) => s + r.score, 0) / total);
    const totalCorrect = records.reduce((s, r) => s + r.correct, 0);
    const totalWrong = records.reduce((s, r) => s + r.wrong, 0);
    
    container.innerHTML = '<div style="margin-bottom:16px;padding:14px;background:#eef2ff;border-radius:10px">' +
      '<div style="font-size:13px;color:#666;margin-bottom:6px">📊 总览</div>' +
      '<div style="display:flex;gap:16px;flex-wrap:wrap">' +
      '<span>考试次数: <b>' + total + '</b></span>' +
      '<span>平均分: <b style="color:#4f6ef7">' + avgScore + '</b></span>' +
      '<span>总正确: <b style="color:#22c55e">' + totalCorrect + '</b></span>' +
      '<span>总错误: <b style="color:#ef4444">' + totalWrong + '</b></span>' +
      '</div></div><div style="font-size:13px;color:#666;margin-bottom:8px">📋 详细记录</div>';
    
    records.slice().reverse().forEach((r) => {
      const div = document.createElement('div');
      div.style.cssText = 'padding:14px;margin-bottom:10px;border-radius:8px;border:1px solid #e5e7eb;background:#fafafa';
      const color = r.score >= 80 ? '#22c55e' : r.score >= 60 ? '#f59e0b' : '#ef4444';
      div.innerHTML = '<div style="font-weight:600;margin-bottom:4px;font-size:15px">' +
        '👤 ' + r.name + ' (' + r.id + ')</div>' +
        '<div style="font-size:13px;color:#666">' +
        '得分: <span style="color:' + color + ';font-weight:700;font-size:18px">' + r.score + '</span> 分 | ' +
        '✅' + r.correct + ' ❌' + r.wrong + ' ⏭️' + r.empty + ' | ' + r.total + '题 | ' +
        '🕐 ' + r.time + '</div>';
      container.appendChild(div);
    });
  } catch(e) {
    container.innerHTML = '<div style="text-align:center;color:#999;padding:40px 0;font-size:15px">加载失败</div>';
  }
}

function retryWrong() {
  const wrongIds = getWrongIds();
  if (wrongIds.length === 0) { alert('🎉 没有错题！'); return; }

  const pool = QUESTION_BANK.filter(q => wrongIds.includes(q.id));
  const shuffled = pool.sort(() => Math.random() - 0.5);
  const count = Math.min(parseInt(document.getElementById('exam-count').value), shuffled.length);

  state.questions = shuffled.slice(0, count);
  state.currentQ = 0;
  state.answers = {};
  state.confirmed = {};
  state.correctCount = 0;
  state.wrongCount = 0;
  state.emptyCount = 0;
  state.timePerQ = parseInt(document.getElementById('exam-time-per-q').value);
  state.isSubmitted = false;
  state.wrongMode = true;

  document.getElementById('page-result').classList.add('hide');
  document.getElementById('page-home').classList.add('hide');
  document.getElementById('page-exam').classList.remove('hide');

  renderQuestion(0);
}

// 初始化
updateWrongBtn();
</script>
